spring.application.name=veterinariaAnimalVet
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSON formatting
spring.jackson.serialization.indent-output=true

# Inicialización de datos: manejado por DataInitializer.java (CommandLineRunner con BCrypt)
# data.sql está presente pero no se ejecuta automáticamente
spring.sql.init.mode=never

# Configuración de sesión HTTP
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Thymeleaf
spring.thymeleaf.cache=false